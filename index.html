<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>petal. — notes & tasks</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Nunito:wght@300;400;500;600;700&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#fdf6ee;
  --cream2:#faf0e4;
  --cream3:#f5e8d4;
  --blush:#f4cfc7;
  --blush2:#edb9af;
  --blush3:#e8a097;
  --rose:#d4756a;
  --rose2:#c25e52;
  --sage:#b8c9b0;
  --sage2:#96b08c;
  --sage3:#6e8f66;
  --dusty:#c9b8d4;
  --dusty2:#a892bc;
  --lavender:#e8e0f0;
  --mauve:#8b7a9e;
  --caramel:#d4a96a;
  --caramel2:#b8865a;
  --text:#3d2e28;
  --text2:#7a5c54;
  --text3:#b09088;
  --white:#fff9f4;
  --shadow:rgba(180,120,100,0.13);
  --shadow2:rgba(180,120,100,0.22);
  --serif:'Playfair Display',Georgia,serif;
  --script:'Dancing Script',cursive;
  --body:'Nunito',sans-serif;
  --radius:14px;
  --radius-lg:22px;
  --radius-xl:30px;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--body);
  background:var(--cream);
  color:var(--text);
  display:flex;flex-direction:column;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(244,207,199,0.4) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(184,201,176,0.3) 0%, transparent 50%),
    radial-gradient(circle at 60% 10%, rgba(201,184,212,0.25) 0%, transparent 40%);
}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--blush2);border-radius:99px}

/* ─── NAV ─────────────────────────────────────────────── */
nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;height:58px;
  background:rgba(253,246,238,0.85);
  backdrop-filter:blur(16px);
  border-bottom:1.5px solid rgba(244,207,199,0.5);
  flex-shrink:0;position:relative;z-index:50;
}
.logo{
  font-family:var(--script);font-size:28px;font-weight:700;
  color:var(--rose);letter-spacing:0.02em;
  display:flex;align-items:center;gap:6px;
}
.logo-sub{
  font-family:var(--body);font-size:10px;font-weight:600;
  color:var(--text3);letter-spacing:0.12em;text-transform:uppercase;
  align-self:flex-end;margin-bottom:6px;
}
.nav-tabs{display:flex;gap:6px}
.nav-tab{
  padding:7px 20px;border-radius:99px;border:1.5px solid transparent;
  background:none;font-family:var(--body);font-size:13px;font-weight:600;
  color:var(--text3);cursor:pointer;transition:all 0.2s;
  display:flex;align-items:center;gap:7px;
}
.nav-tab .tab-icon{font-size:15px}
.nav-tab.active{
  background:var(--white);border-color:var(--blush2);
  color:var(--rose);
  box-shadow:0 2px 10px var(--shadow);
}
.nav-tab:hover:not(.active){background:rgba(244,207,199,0.25);color:var(--text2)}
.nav-right{display:flex;align-items:center;gap:8px}
.avatar{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--blush),var(--dusty));
  display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;
  box-shadow:0 2px 8px var(--shadow);
}

/* ─── MAIN ────────────────────────────────────────────── */
main{flex:1;overflow:hidden;position:relative}
.panel{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.panel.active{display:flex}

/* ─── TASKS ───────────────────────────────────────────── */
#panel-tasks{flex-direction:row}
.tasks-sidebar{
  width:260px;flex-shrink:0;
  background:rgba(250,240,228,0.7);backdrop-filter:blur(12px);
  border-right:1.5px solid rgba(244,207,199,0.4);
  display:flex;flex-direction:column;padding:20px 16px;gap:12px;overflow-y:auto;
}
.sidebar-section-title{
  font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text3);padding:0 8px;
}
.cat-btn{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:var(--radius);border:none;
  background:none;font-family:var(--body);font-size:13px;font-weight:600;
  color:var(--text2);cursor:pointer;transition:all 0.15s;text-align:left;width:100%;
}
.cat-btn.active,.cat-btn:hover{background:var(--white);color:var(--rose);box-shadow:0 2px 8px var(--shadow)}
.cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cat-count{
  margin-left:auto;font-size:11px;background:var(--blush);
  color:var(--rose2);padding:1px 7px;border-radius:99px;font-weight:700;
}
.add-cat-row{display:flex;gap:6px;padding:0 4px}
.mini-input{
  flex:1;background:var(--white);border:1.5px solid var(--blush);
  border-radius:10px;padding:7px 10px;font-size:12px;font-family:var(--body);
  color:var(--text);outline:none;transition:border-color 0.15s;
}
.mini-input:focus{border-color:var(--rose)}
.mini-btn{
  padding:7px 10px;background:var(--rose);border:none;border-radius:10px;
  color:white;font-size:13px;cursor:pointer;transition:background 0.15s;font-weight:700;
}
.mini-btn:hover{background:var(--rose2)}
.mood-strip{
  margin-top:auto;background:var(--white);border-radius:var(--radius-lg);
  padding:14px;box-shadow:0 2px 10px var(--shadow);
}
.mood-title{font-family:var(--script);font-size:17px;color:var(--rose);margin-bottom:8px}
.mood-emojis{display:flex;justify-content:space-between}
.mood-btn{
  font-size:20px;cursor:pointer;padding:6px;border-radius:10px;border:none;
  background:none;transition:transform 0.15s;
}
.mood-btn:hover,.mood-btn.selected{transform:scale(1.3)}
.mood-btn.selected{background:var(--blush);border-radius:10px}

.tasks-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tasks-header{
  padding:18px 24px 0;flex-shrink:0;
}
.tasks-title-row{
  display:flex;align-items:center;gap:12px;margin-bottom:14px;
}
.page-title{font-family:var(--serif);font-size:26px;font-weight:400;color:var(--text);font-style:italic}
.task-stats-row{display:flex;gap:10px;margin-bottom:12px}
.stat-pill{
  padding:5px 14px;border-radius:99px;font-size:12px;font-weight:700;
  background:var(--white);box-shadow:0 1px 6px var(--shadow);color:var(--text2);
  display:flex;align-items:center;gap:5px;
}
.stat-pill .num{font-size:15px;color:var(--rose);font-family:var(--serif)}
.add-task-row{
  display:flex;gap:10px;padding:0 24px 14px;flex-shrink:0;
}
.task-text-input{
  flex:1;background:var(--white);border:2px solid var(--blush);
  border-radius:var(--radius);padding:11px 16px;
  font-size:14px;font-family:var(--body);color:var(--text);outline:none;
  transition:border-color 0.2s,box-shadow 0.2s;
  box-shadow:0 2px 8px var(--shadow);
}
.task-text-input:focus{border-color:var(--rose);box-shadow:0 2px 16px var(--shadow2)}
.task-text-input::placeholder{color:var(--text3)}
select.cute-select{
  background:var(--white);border:2px solid var(--blush);
  border-radius:var(--radius);padding:11px 12px;
  font-size:13px;font-family:var(--body);color:var(--text2);
  outline:none;cursor:pointer;box-shadow:0 2px 8px var(--shadow);
}
.btn-cute{
  padding:11px 20px;background:var(--rose);border:none;
  border-radius:var(--radius);color:white;font-size:14px;
  font-weight:700;font-family:var(--body);cursor:pointer;
  box-shadow:0 4px 14px rgba(210,100,90,0.35);transition:all 0.2s;
  white-space:nowrap;
}
.btn-cute:hover{background:var(--rose2);transform:translateY(-1px);box-shadow:0 6px 18px rgba(210,100,90,0.4)}
.btn-cute:active{transform:translateY(0)}

.filter-row{
  display:flex;gap:6px;padding:0 24px 14px;flex-shrink:0;flex-wrap:wrap;
}
.filter-chip{
  padding:5px 14px;border-radius:99px;border:1.5px solid var(--blush);
  background:none;font-size:12px;font-weight:600;color:var(--text3);
  cursor:pointer;transition:all 0.15s;font-family:var(--body);
}
.filter-chip.active{background:var(--blush);color:var(--rose);border-color:var(--blush2)}
.filter-chip:hover:not(.active){background:rgba(244,207,199,0.3)}

.tasks-list{flex:1;overflow-y:auto;padding:0 24px 20px;display:flex;flex-direction:column;gap:8px}

.task-card{
  display:flex;align-items:center;gap:12px;
  background:var(--white);border:1.5px solid rgba(244,207,199,0.5);
  border-radius:var(--radius-lg);padding:13px 16px;
  transition:all 0.2s;animation:taskIn 0.25s ease;
  box-shadow:0 2px 10px var(--shadow);position:relative;overflow:hidden;
}
.task-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  border-radius:4px 0 0 4px;
}
.task-card.p-high::before{background:var(--rose)}
.task-card.p-medium::before{background:var(--caramel)}
.task-card.p-low::before{background:var(--sage2)}
@keyframes taskIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.task-card:hover{border-color:var(--blush2);box-shadow:0 4px 18px var(--shadow2);transform:translateX(3px)}
.task-card.done-card{opacity:0.55}
.task-card.done-card .task-label{text-decoration:line-through;color:var(--text3)}

.check-circle{
  width:22px;height:22px;border-radius:50%;border:2px solid var(--blush2);
  cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;background:none;
}
.check-circle.checked{background:var(--rose);border-color:var(--rose)}
.check-circle svg{width:10px;height:10px;opacity:0}
.check-circle.checked svg{opacity:1}

.task-label{
  flex:1;font-size:14px;font-weight:500;color:var(--text);
  outline:none;background:none;border:none;font-family:var(--body);cursor:text;
}
.task-label:focus{
  background:rgba(244,207,199,0.2);border-radius:6px;padding:2px 8px;
}
.task-tag{
  font-size:11px;padding:3px 10px;border-radius:99px;font-weight:700;
  background:var(--lavender);color:var(--mauve);
}
.task-del{
  width:28px;height:28px;border-radius:8px;border:none;background:none;
  color:var(--text3);cursor:pointer;transition:all 0.15s;
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.task-del:hover{background:rgba(212,117,106,0.12);color:var(--rose)}
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;height:220px;
}
.empty-emoji{font-size:48px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.empty-text{font-family:var(--script);font-size:20px;color:var(--text3)}

/* ─── NOTES ───────────────────────────────────────────── */
#panel-notes{flex-direction:column}
.notes-header{
  display:flex;align-items:center;gap:12px;
  padding:16px 28px;border-bottom:1.5px solid rgba(244,207,199,0.4);
  background:rgba(253,246,238,0.8);backdrop-filter:blur(12px);flex-shrink:0;
}
.notes-header-title{font-family:var(--serif);font-size:22px;font-style:italic;color:var(--text)}
.template-scroll{
  display:flex;gap:10px;padding:14px 28px 10px;overflow-x:auto;flex-shrink:0;
}
.template-scroll::-webkit-scrollbar{height:3px}
.template-chip{
  flex-shrink:0;padding:8px 16px;border-radius:99px;
  border:1.5px solid var(--blush);background:var(--white);
  font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;
  transition:all 0.18s;white-space:nowrap;display:flex;align-items:center;gap:6px;
  box-shadow:0 1px 6px var(--shadow);font-family:var(--body);
}
.template-chip .chip-emoji{font-size:14px}
.template-chip:hover{border-color:var(--rose);color:var(--rose);transform:translateY(-2px);box-shadow:0 4px 12px var(--shadow2)}
.template-chip.active{background:var(--blush);border-color:var(--blush2);color:var(--rose)}

.notes-grid{
  flex:1;overflow-y:auto;padding:16px 28px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:16px;align-content:start;
}

.note-card{
  border-radius:var(--radius-xl);padding:0;
  position:relative;animation:noteIn 0.3s ease;
  transition:transform 0.2s,box-shadow 0.2s;
  box-shadow:0 4px 20px var(--shadow);overflow:hidden;
  display:flex;flex-direction:column;min-height:220px;
}
@keyframes noteIn{from{opacity:0;transform:scale(0.93) rotate(-1deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.note-card:hover{transform:translateY(-4px) rotate(0.3deg);box-shadow:0 10px 32px var(--shadow2)}

/* Template skins */
.skin-cream{background:var(--white);border:2px solid rgba(244,207,199,0.5)}
.skin-blush{background:linear-gradient(145deg,#fdf0ed,#f9e0db)}
.skin-sage{background:linear-gradient(145deg,#eef4ec,#dfecd9)}
.skin-lavender{background:linear-gradient(145deg,#f0ecf8,#e4daf0)}
.skin-caramel{background:linear-gradient(145deg,#fef5e6,#fae8cc)}
.skin-dark{background:linear-gradient(145deg,#3d2e28,#5c4038);color:var(--cream)}
.skin-grid{background:#fdfaf7;background-image:linear-gradient(rgba(200,170,160,0.15) 1px,transparent 1px),linear-gradient(90deg,rgba(200,170,160,0.15) 1px,transparent 1px);background-size:24px 24px}
.skin-dots{background:#fdfaf7;background-image:radial-gradient(circle,rgba(200,170,160,0.4) 1px,transparent 1px);background-size:20px 20px}
.skin-lines{background:#fdfaf7;background-image:repeating-linear-gradient(transparent,transparent 27px,rgba(200,170,160,0.3) 27px,rgba(200,170,160,0.3) 28px)}
.skin-floral{background:var(--white);border:2px solid rgba(244,207,199,0.5)}
.skin-floral::after{
  content:'❀ ✿ ❁ ✾ ❀';position:absolute;bottom:8px;right:12px;
  font-size:13px;opacity:0.2;pointer-events:none;letter-spacing:4px;
}

.note-tape{
  position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:50px;height:18px;border-radius:2px;opacity:0.7;z-index:2;
}
.tape-pink{background:rgba(244,207,199,0.9)}
.tape-sage{background:rgba(184,201,176,0.9)}
.tape-lavender{background:rgba(201,184,212,0.9)}

.note-inner{padding:22px 18px 14px;flex:1;display:flex;flex-direction:column;gap:8px}
.note-title-input{
  font-family:var(--serif);font-size:16px;font-weight:600;
  background:none;border:none;outline:none;color:inherit;width:100%;
  border-bottom:1.5px dashed rgba(180,120,100,0.2);padding-bottom:6px;
}
.note-title-input::placeholder{color:rgba(180,120,100,0.4);font-style:italic}
.note-body-input{
  flex:1;background:none;border:none;outline:none;resize:none;
  font-family:var(--body);font-size:13px;color:inherit;line-height:1.7;
  min-height:100px;font-weight:400;
}
.note-body-input::placeholder{color:rgba(180,120,100,0.4);font-style:italic}
.note-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 18px 14px;flex-shrink:0;
}
.note-date{font-size:11px;color:var(--text3);font-style:italic}
.note-actions{display:flex;gap:4px}
.note-action-btn{
  width:26px;height:26px;border-radius:8px;border:none;background:none;
  cursor:pointer;font-size:14px;transition:transform 0.15s,background 0.15s;
  display:flex;align-items:center;justify-content:center;
}
.note-action-btn:hover{background:rgba(180,120,100,0.12);transform:scale(1.1)}

.new-note-card{
  border-radius:var(--radius-xl);border:2.5px dashed var(--blush2);
  background:rgba(253,246,238,0.5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;cursor:pointer;min-height:220px;
  transition:all 0.2s;
}
.new-note-card:hover{background:rgba(244,207,199,0.2);border-color:var(--rose);transform:scale(1.01)}
.new-note-icon{font-size:36px;opacity:0.4}
.new-note-text{font-family:var(--script);font-size:18px;color:var(--text3)}

/* Modal */
.modal-bg{
  position:fixed;inset:0;background:rgba(61,46,40,0.35);
  backdrop-filter:blur(6px);display:none;align-items:center;
  justify-content:center;z-index:200;
}
.modal-bg.open{display:flex}
.modal-box{
  background:var(--cream);border-radius:var(--radius-xl);padding:28px;
  width:480px;max-width:95vw;
  box-shadow:0 20px 60px rgba(61,46,40,0.25);
  animation:modalIn 0.25s cubic-bezier(.34,1.56,.64,1);
}
@keyframes modalIn{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-title{font-family:var(--script);font-size:26px;color:var(--rose);margin-bottom:18px}
.field-label{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px;margin-top:12px}
.field-input{
  width:100%;background:var(--white);border:2px solid var(--blush);
  border-radius:var(--radius);padding:10px 14px;font-size:14px;
  font-family:var(--body);color:var(--text);outline:none;transition:border-color 0.15s;
}
.field-input:focus{border-color:var(--rose)}
textarea.field-input{resize:vertical;min-height:90px;line-height:1.6}
.template-picker{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tpl-swatch{
  width:38px;height:38px;border-radius:10px;cursor:pointer;border:2.5px solid transparent;
  transition:transform 0.15s,border-color 0.15s;
}
.tpl-swatch:hover{transform:scale(1.1)}
.tpl-swatch.chosen{border-color:var(--rose);transform:scale(1.15)}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
.btn-ghost{
  padding:10px 18px;border-radius:var(--radius);border:2px solid var(--blush2);
  background:none;color:var(--text2);font-size:14px;font-family:var(--body);
  font-weight:600;cursor:pointer;transition:all 0.15s;
}
.btn-ghost:hover{background:var(--blush);color:var(--rose)}

/* ─── DRAW (Procreate-style) ─────────────────────────── */
#panel-draw{flex-direction:column;position:relative}
.draw-toolbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 18px;border-bottom:1.5px solid rgba(244,207,199,0.4);
  background:rgba(253,246,238,0.9);backdrop-filter:blur(12px);
  flex-shrink:0;
}
.tool-group{
  display:flex;gap:3px;background:var(--white);border-radius:14px;
  padding:4px;border:1.5px solid rgba(244,207,199,0.6);
  box-shadow:0 2px 8px var(--shadow);
}
.draw-btn{
  width:36px;height:36px;border-radius:10px;border:none;background:none;
  font-size:17px;cursor:pointer;transition:all 0.15s;color:var(--text2);
  display:flex;align-items:center;justify-content:center;
}
.draw-btn.active{background:var(--blush);color:var(--rose)}
.draw-btn:hover:not(.active){background:rgba(244,207,199,0.4);color:var(--text)}
.sep{width:1px;background:rgba(244,207,199,0.6);height:34px;flex-shrink:0}
.slider-wrap{display:flex;align-items:center;gap:6px}
.slider-lbl{font-size:11px;font-weight:700;color:var(--text3);white-space:nowrap}
input[type=range]{
  -webkit-appearance:none;width:80px;height:4px;
  background:var(--blush);border-radius:2px;outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--rose);cursor:pointer;
  box-shadow:0 1px 6px rgba(210,100,90,0.4);
}
.palette-row{display:flex;gap:5px;align-items:center}
.pal-color{
  width:26px;height:26px;border-radius:50%;cursor:pointer;
  border:2.5px solid transparent;transition:transform 0.1s,border-color 0.1s;
}
.pal-color:hover,.pal-color.active{transform:scale(1.2);border-color:white;box-shadow:0 2px 8px var(--shadow2)}
input[type=color]{
  width:28px;height:28px;border:none;border-radius:50%;cursor:pointer;
  background:none;padding:0;
}
.canvas-container{
  flex:1;overflow:hidden;position:relative;
  background:var(--white);
  background-image:radial-gradient(circle at 1px 1px,rgba(200,170,160,0.35) 1px,transparent 0);
  background-size:22px 22px;
}
canvas#draw-canvas{display:block;touch-action:none;cursor:crosshair}
.draw-hint{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  font-size:11px;color:var(--text3);pointer-events:none;
  background:rgba(253,246,238,0.8);padding:4px 12px;border-radius:99px;

<script>
/* ═══════════════════════════════════════════════════════════
   DATA LAYER  (JS shim — identical API as C++ exports)
   ═══════════════════════════════════════════════════════════ */
const DB = (() => {
  let tasks=[], notes=[], tid=1, nid=1;
  return {
    addTask(title,cat,pri,created){ const t={id:tid++,title,cat,pri,done:false,created}; tasks.push(t); return t.id; },
    delTask(id){ tasks=tasks.filter(t=>t.id!==id); },
    toggleTask(id){ const t=tasks.find(t=>t.id===id); if(t) t.done=!t.done; },
    editTask(id,title){ const t=tasks.find(t=>t.id===id); if(t) t.title=title; },
    getTasks(){ return tasks; },
    clearDone(){ tasks=tasks.filter(t=>!t.done); },
    addNote(title,body,skin,type,created){ const n={id:nid++,title,body,skin,type,created}; notes.push(n); return n.id; },
    delNote(id){ notes=notes.filter(n=>n.id!==id); },
    editNote(id,key,val){ const n=notes.find(n=>n.id===id); if(n) n[key]=val; },
    getNotes(){ return notes; },
  };
})();

/* ═══════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════ */
const h=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const now=()=>new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
const tapeColors=['tape-pink','tape-sage','tape-lavender'];
let selectedSkin='skin-cream';
let taskFilterMode='all', taskCatFilter='all';
let noteTemplateFilter='all';

/* ═══════════════════════════════════════════════════════════
   PANEL SWITCH
   ═══════════════════════════════════════════════════════════ */
function switchPanel(name,el){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  el.classList.add('active');
  if(name==='draw') resizeCanvas();
}

/* ═══════════════════════════════════════════════════════════
   TASKS
   ═══════════════════════════════════════════════════════════ */
function addTaskUI(){
  const inp=document.getElementById('task-inp');
  const t=inp.value.trim(); if(!t){inp.focus();return;}
  const cat=document.getElementById('task-cat-sel').value;
  const pri=document.getElementById('task-pri-sel').value;
  DB.addTask(t,cat,pri,now()); inp.value='';
  renderTasks();
}
function setTaskFilter(f,el){
  taskFilterMode=f;
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active'); renderTasks();
}
function filterCat(c,el){
  taskCatFilter=c;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('task-page-title').textContent=c==='all'?'All Tasks':c;
  renderTasks();
}
function clearDone(){ DB.clearDone(); renderTasks(); }
function setMood(el){
  document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
}
function addCat(){
  const inp=document.getElementById('new-cat-inp');
  const v=inp.value.trim(); if(!v) return;
  const ec=document.getElementById('extra-cats');
  const cat=v; inp.value='';
  const colors=['var(--rose)','var(--caramel)','var(--sage2)','var(--dusty2)','var(--mauve)'];
  const col=colors[ec.children.length%colors.length];
  const btn=document.createElement('button');
  btn.className='cat-btn'; btn.dataset.cat=cat;
  btn.innerHTML=`<span class="cat-dot" style="background:${col}"></span>${h(cat)}<span class="cat-count">0</span>`;
  btn.onclick=function(){ filterCat(cat,this); };
  ec.appendChild(btn);
  const sel=document.getElementById('task-cat-sel');
  const opt=document.createElement('option'); opt.value=cat; opt.textContent=cat;
  sel.appendChild(opt);
}
function renderTasks(){
  let all=DB.getTasks();
  /* count per cat */
  ['Personal','Work','Study','Health'].forEach(c=>{
    const el=document.getElementById('cnt-'+c);
    if(el) el.textContent=all.filter(t=>t.cat===c).length;
  });
  document.getElementById('cnt-all').textContent=all.length;
  document.querySelectorAll('#extra-cats .cat-btn').forEach(b=>{
    const cats=all.filter(t=>t.cat===b.dataset.cat);
    b.querySelector('.cat-count').textContent=cats.length;
  });
  const done=all.filter(t=>t.done).length;
  document.getElementById('s-total').textContent=all.length;
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-left').textContent=all.length-done;
  let show=all;
  if(taskCatFilter!=='all') show=show.filter(t=>t.cat===taskCatFilter);
  if(taskFilterMode==='active') show=show.filter(t=>!t.done);
  if(taskFilterMode==='done') show=show.filter(t=>t.done);
  const list=document.getElementById('tasks-list');
  if(!show.length){
    list.innerHTML=`<div class="empty-state"><div class="empty-emoji">🌸</div><div class="empty-text">nothing here yet~</div></div>`;
    return;
  }
  list.innerHTML=show.map(t=>`
    <div class="task-card p-${t.pri} ${t.done?'done-card':''}" id="tc-${t.id}">
      <div class="check-circle ${t.done?'checked':''}" onclick="toggleT(${t.id})">
        <svg viewBox="0 0 10 8" fill="none" stroke="white" stroke-width="2.2">
          <path d="M1 4l3 3 5-6"/>
        </svg>
      </div>
      <div class="task-label" contenteditable="true"
           onblur="DB.editTask(${t.id},this.textContent.trim())">${h(t.title)}</div>
      <span class="task-tag">${h(t.cat)}</span>
      <span style="font-size:11px;color:var(--text3);font-style:italic">${t.created}</span>
      <button class="task-del" onclick="delT(${t.id})">×</button>
    </div>`).join('');
}

function delT(id){ DB.delTask(id); renderTasks(); }

/* ═══════════════════════════════════════════════════════════
   DRAW — Procreate-style multi-layer canvas engine
   ═══════════════════════════════════════════════════════════ */
const mainCanvas=document.getElementById('draw-canvas');
const ctx=mainCanvas.getContext('2d');
let drawCol='#3d2e28', bSize=6, bOpacity=1, bFlow=0.8;
let currentTool='pen';
let isDown=false, lastX=0, lastY=0, startX=0, startY=0;
let snapData=null, historyStack=[], redoStack=[];
let textEl=null;
let pressure=0.5; // simulated

// Multi-layer
let layers=[], activeLayerIdx=0;
function mkCanvas(){ const c=document.createElement('canvas'); c.width=mainCanvas.width; c.height=mainCanvas.height; return c; }
function mkLayer(name){ return {name, canvas:mkCanvas(), visible:true, opacity:1}; }

function initLayers(){
  layers=[mkLayer('Layer 1')];
  activeLayerIdx=0;
  renderLayers();
}

function addLayer(){
  const idx=layers.length+1;
  layers.unshift(mkLayer('Layer '+idx));
  activeLayerIdx=0;
  renderLayers(); compositeAll();
}

function renderLayers(){
  const list=document.getElementById('layers-list');
  list.innerHTML=layers.map((l,i)=>`
    <div class="layer-item ${i===activeLayerIdx?'active':''}" onclick="setActiveLayer(${i})">
      <div class="layer-thumb"><canvas id="lth-${i}" width="28" height="28"></canvas></div>
      ${l.name}
    </div>`).join('');
  layers.forEach((l,i)=>{
    const th=document.getElementById('lth-'+i);
    if(!th) return;
    const tc=th.getContext('2d');
    tc.clearRect(0,0,28,28);
    tc.drawImage(l.canvas,0,0,28,28);
  });
}

function setActiveLayer(i){ activeLayerIdx=i; renderLayers(); }

function getActiveCtx(){ return layers[activeLayerIdx].canvas.getContext('2d'); }

function compositeAll(){
  ctx.clearRect(0,0,mainCanvas.width,mainCanvas.height);
  [...layers].reverse().forEach(l=>{
    if(!l.visible) return;
    ctx.globalAlpha=l.opacity;
    ctx.drawImage(l.canvas,0,0);
  });
  ctx.globalAlpha=1;
  renderLayers();
}

function resizeCanvas(){
  const wrap=document.getElementById('canvas-wrap');
  const w=wrap.clientWidth, h=wrap.clientHeight;
  const prev=ctx.getImageData(0,0,mainCanvas.width,mainCanvas.height);
  mainCanvas.width=w; mainCanvas.height=h;
  layers.forEach(l=>{ l.canvas.width=w; l.canvas.height=h; });
  ctx.putImageData(prev,0,0);
  compositeAll();
}

function saveHistory(){
  const ac=getActiveCtx().canvas;
  historyStack.push(ac.toDataURL());
  if(historyStack.length>50) historyStack.shift();
  redoStack=[];
}

function undo(){
  if(!historyStack.length) return;
  const ac=getActiveCtx();
  redoStack.push(ac.canvas.toDataURL());
  const prev=new Image();
  prev.src=historyStack.pop();
  prev.onload=()=>{ ac.clearRect(0,0,ac.canvas.width,ac.canvas.height); ac.drawImage(prev,0,0); compositeAll(); };
}

function redo(){
  if(!redoStack.length) return;
  const ac=getActiveCtx();
  historyStack.push(ac.canvas.toDataURL());
  const next=new Image();
  next.src=redoStack.pop();
  next.onload=()=>{ ac.clearRect(0,0,ac.canvas.width,ac.canvas.height); ac.drawImage(next,0,0); compositeAll(); };
}

function clearDraw(){ saveHistory(); getActiveCtx().clearRect(0,0,mainCanvas.width,mainCanvas.height); compositeAll(); }

function setTool(tool,el){
  currentTool=tool;
  document.querySelectorAll('.draw-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  mainCanvas.style.cursor=tool==='eraser'?'cell':tool==='text'?'text':'crosshair';
}

function pickPalColor(el){
  document.querySelectorAll('.pal-color').forEach(e=>e.classList.remove('active'));
  el.classList.add('active'); drawCol=el.dataset.c;
  document.getElementById('custom-col').value=drawCol;
}

function toggleLayers(){
  document.getElementById('layers-panel').classList.toggle('open');
  document.getElementById('brush-panel').classList.remove('open');
}

function toggleBrushPanel(){
  document.getElementById('brush-panel').classList.toggle('open');
  document.getElementById('layers-panel').classList.remove('open');
}

function applyPreset(p,el){
  document.querySelectorAll('.brush-preset').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  setTool(p, document.getElementById('tb-'+p));
}

/* ── Drawing behaviour per tool ─────────────────────────── */
function applyStyle(c){
  c.globalAlpha=bOpacity;
  c.strokeStyle=currentTool==='eraser'?'rgba(0,0,0,1)':drawCol;
  c.fillStyle=drawCol;
  c.lineWidth=bSize;
  c.lineCap='round'; c.lineJoin='round';
  if(currentTool==='eraser') c.globalCompositeOperation='destination-out';
  else c.globalCompositeOperation='source-over';
}

function getXY(e){
  const r=mainCanvas.getBoundingClientRect();
  if(e.touches) return {x:e.touches[0].clientX-r.left,y:e.touches[0].clientY-r.top};
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}

function brushStroke(c,x,y,px,py){
  /* per-tool stroke style */
  if(currentTool==='pen'){
    c.beginPath(); c.moveTo(px,py); c.lineTo(x,y); c.stroke();
  } else if(currentTool==='ink'){
    c.globalAlpha=bOpacity*bFlow;
    c.lineWidth=bSize*(0.7+pressure*0.6);
    c.beginPath(); c.moveTo(px,py); c.lineTo(x,y); c.stroke();
  } else if(currentTool==='chalk'){
    /* chalk = scattered dots */
    for(let i=0;i<6;i++){
      const rx=px+(x-px)*Math.random()+(Math.random()-0.5)*bSize*1.5;
      const ry=py+(y-py)*Math.random()+(Math.random()-0.5)*bSize*1.5;
      c.globalAlpha=bOpacity*(Math.random()*0.4+0.1);
      c.beginPath(); c.arc(rx,ry,bSize*0.35,0,Math.PI*2); c.fill();
    }
    c.globalAlpha=bOpacity;
  } else if(currentTool==='marker'){
    c.globalAlpha=bOpacity*0.55;
    c.lineWidth=bSize*1.8;
    c.lineCap='square';
    c.beginPath(); c.moveTo(px,py); c.lineTo(x,y); c.stroke();
    c.lineCap='round'; c.lineWidth=bSize;
  } else if(currentTool==='water'){
    /* watercolour: soft semitransparent smear */
    c.globalAlpha=bOpacity*bFlow*0.18;
    for(let i=0;i<3;i++){
      const ox=(Math.random()-0.5)*bSize*0.8, oy=(Math.random()-0.5)*bSize*0.8;
      c.lineWidth=bSize*(1.2+Math.random()*0.6);
      c.beginPath(); c.moveTo(px+ox,py+oy); c.lineTo(x+ox,y+oy); c.stroke();
    }
    c.globalAlpha=bOpacity;
  } else if(currentTool==='smudge'){
    /* smudge: copy nearby pixels with blur effect */
    try{
      const smudge=c.getImageData(x-bSize,y-bSize,bSize*2,bSize*2);
      c.globalAlpha=0.25*bFlow;
      c.putImageData(smudge,px-bSize,py-bSize);
      c.globalAlpha=bOpacity;
    }catch(e){}
  } else if(currentTool==='eraser'){
    c.beginPath(); c.arc(x,y,bSize,0,Math.PI*2); c.fill();
  }
}

mainCanvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(currentTool==='text'){ placeText(e); return; }
  if(currentTool==='fill'){ floodFill(e); return; }
  saveHistory();
  isDown=true;
  const p=getXY(e); lastX=startX=p.x; lastY=startY=p.y;
  pressure=e.pressure||0.5;
  const ac=getActiveCtx();
  applyStyle(ac);
  if(['pen','ink','chalk','marker','water','eraser','smudge'].includes(currentTool)){
    ac.beginPath(); ac.moveTo(lastX,lastY);
  }
  snapData=getActiveCtx().canvas.toDataURL();
});

mainCanvas.addEventListener('pointermove',e=>{
  e.preventDefault();
  if(!isDown) return;
  const p=getXY(e);
  pressure=e.pressure||pressure;
  const ac=getActiveCtx();
  applyStyle(ac);
  if(['pen','ink','chalk','marker','water','eraser','smudge'].includes(currentTool)){
    brushStroke(ac,p.x,p.y,lastX,lastY);
    lastX=p.x; lastY=p.y;
    compositeAll();
  } else {
    /* shape preview: redraw from snap */
    const img=new Image(); img.src=snapData;
    ac.clearRect(0,0,ac.canvas.width,ac.canvas.height);
    ac.drawImage(img,0,0);
    applyStyle(ac); ac.beginPath();
    if(currentTool==='line'){
      ac.moveTo(startX,startY); ac.lineTo(p.x,p.y); ac.stroke();
    } else if(currentTool==='rect'){
      ac.strokeRect(startX,startY,p.x-startX,p.y-startY);
    } else if(currentTool==='circle'){
      const rx=(p.x-startX)/2,ry=(p.y-startY)/2;
      ac.ellipse(startX+rx,startY+ry,Math.abs(rx),Math.abs(ry),0,0,Math.PI*2); ac.stroke();
    }
    compositeAll();
  }
});

mainCanvas.addEventListener('pointerup',()=>{ isDown=false; snapData=null; compositeAll(); renderLayers(); });
mainCanvas.addEventListener('pointerleave',()=>{ isDown=false; });

function placeText(e){
  if(textEl){ commitText(); return; }
  const p=getXY(e);
  textEl=document.createElement('input');
  textEl.style.cssText=`position:absolute;left:${p.x}px;top:${p.y}px;background:transparent;
    border:none;border-bottom:1.5px dashed ${drawCol};color:${drawCol};
    font-size:${Math.max(14,bSize*2.5)}px;outline:none;z-index:20;min-width:90px;
    font-family:'Playfair Display',serif;font-style:italic;padding:2px 4px;`;
  document.getElementById('canvas-wrap').appendChild(textEl);
  textEl.focus(); textEl._pos=p;
  textEl.addEventListener('keydown',ev=>{ if(ev.key==='Enter') commitText(); if(ev.key==='Escape'){ textEl.remove(); textEl=null; } });
  textEl.addEventListener('blur',()=>setTimeout(commitText,120));
}

function commitText(){
  if(!textEl) return;
  const val=textEl.value.trim(); const p=textEl._pos;
  textEl.remove(); textEl=null;
  if(!val) return;
  saveHistory();
  const ac=getActiveCtx();
  ac.globalAlpha=bOpacity; ac.fillStyle=drawCol;
  ac.globalCompositeOperation='source-over';
  ac.font=`italic ${Math.max(14,bSize*2.5)}px 'Playfair Display',serif`;
  ac.fillText(val,p.x,p.y+Math.max(14,bSize*2.5));
  compositeAll(); renderLayers();
}

function floodFill(e){
  saveHistory();
  const p=getXY(e);
  const ac=getActiveCtx();
  const imgData=ac.getImageData(0,0,ac.canvas.width,ac.canvas.height);
  const data=imgData.data;
  const w=ac.canvas.width, h=ac.canvas.height;
  const cx=Math.floor(p.x), cy=Math.floor(p.y);
  if(cx<0||cy<0||cx>=w||cy>=h) return;
  const idx=(cy*w+cx)*4;
  const tR=data[idx],tG=data[idx+1],tB=data[idx+2],tA=data[idx+3];
  const fc=hexToRgb(drawCol);
  if(!fc) return;
  const stack=[[cx,cy]]; const seen=new Set();
  while(stack.length){
    const [x,y]=stack.pop();
    const key=y*w+x; if(seen.has(key)) continue;
    if(x<0||y<0||x>=w||y>=h) continue;
    const i=(y*w+x)*4;
    if(Math.abs(data[i]-tR)>30||Math.abs(data[i+1]-tG)>30||Math.abs(data[i+2]-tB)>30||Math.abs(data[i+3]-tA)>30) continue;
    seen.add(key);
    data[i]=fc.r; data[i+1]=fc.g; data[i+2]=fc.b; data[i+3]=Math.round(bOpacity*255);
    stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
  ac.putImageData(imgData,0,0); compositeAll(); renderLayers();
}

function hexToRgb(hex){
  const r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return r?{r:parseInt(r[1],16),g:parseInt(r[2],16),b:parseInt(r[3],16)}:null;
}

function saveDrawing(){
  const out=document.createElement('canvas');
  out.width=mainCanvas.width; out.height=mainCanvas.height;
  const oc=out.getContext('2d');
  oc.fillStyle=var2hex('--cream'); oc.fillRect(0,0,out.width,out.height);
  [...layers].reverse().forEach(l=>{ if(l.visible){ oc.globalAlpha=l.opacity; oc.drawImage(l.canvas,0,0); } });
  const a=document.createElement('a');
  a.download='petal-drawing.png'; a.href=out.toDataURL(); a.click();
}

function var2hex(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

// Touch support
mainCanvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];mainCanvas.dispatchEvent(new PointerEvent('pointerdown',{clientX:t.clientX,clientY:t.clientY,pressure:0.5}));},{passive:false});
mainCanvas.addEventListener('touchmove', e=>{e.preventDefault();const t=e.touches[0];mainCanvas.dispatchEvent(new PointerEvent('pointermove',{clientX:t.clientX,clientY:t.clientY,pressure:0.5}));},{passive:false});
mainCanvas.addEventListener('touchend', e=>{e.preventDefault();mainCanvas.dispatchEvent(new PointerEvent('pointerup'));},{passive:false});

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.ctrlKey&&e.key==='z'){undo();e.preventDefault();}
  if(e.ctrlKey&&e.key==='y'){redo();e.preventDefault();}
});

window.addEventListener('resize',()=>{ if(document.getElementById('panel-draw').classList.contains('active')) resizeCanvas(); });
